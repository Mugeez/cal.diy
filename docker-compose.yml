version: '3.8'

services:
  calcom:
    image: 'calcom/cal.com:latest'
    container_name: calcom
    command: sh -c "find /calcom/apps/web/.next -name '*.js' -type f -exec sed -i 's|http://localhost:3000|https://schedule.innov8protech.com|g' {} + 2>/dev/null; find /calcom/apps/web/.next -name '*.json' -type f -exec sed -i 's|http://localhost:3000|https://schedule.innov8protech.com|g' {} + 2>/dev/null; npx prisma migrate deploy --schema /calcom/packages/prisma/schema.prisma && npm run start"
    labels:
      caddy_0=https://schedule.innov8protech.com
      caddy_0.encode=zstd gzip
      caddy_0.handle_path=/*
      caddy_0.handle_path.0_reverse_proxy={{upstreams 3000}}
      caddy_0.header=-Server
      caddy_0.try_files={path} /index.html /index.php
      caddy_ingress_network=coolify
    networks:
      - coolify
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - 'DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DATABASE:-calcom}'
      - 'DATABASE_DIRECT_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DATABASE:-calcom}'
      - 'NEXTAUTH_URL=https://schedule.innov8protech.com/api/auth'
      - 'NEXTAUTH_URL_INTERNAL=http://calcom:3000'
      - 'NEXTAUTH_SECRET=${SERVICE_BASE64_32_SECRET}'
      - 'CALENDSO_ENCRYPTION_KEY=${SERVICE_BASE64_32_SECRET}'
      - 'NEXT_PUBLIC_WEBAPP_URL=https://schedule.innov8protech.com'
      - 'NEXT_PUBLIC_API_V2_URL=${SERVICE_API_V2_URL}'
      - 'ALLOWED_HOSTNAMES=["schedule.innov8protech.com"]'
      - 'AUTH_TRUST_HOST=true'
      - 'CALCOM_TELEMETRY_DISABLED=1'
      - 'REDIS_URL=redis://redis:6379'
      - 'EMAIL_SERVER_HOST=${SMTP_HOST}'
      - 'EMAIL_SERVER_PORT=${SMTP_PORT}'
      - 'EMAIL_SERVER_USER=${SMTP_USER}'
      - 'EMAIL_SERVER_PASSWORD=${SMTP_PASSWORD}'
      - 'EMAIL_FROM=${MAIL_FROM}'
    restart: unless-stopped

  postgres:
    image: 'postgres:16-alpine'
    container_name: calcom-postgres
    networks:
      - coolify
    environment:
      - 'POSTGRES_USER=${SERVICE_USER_POSTGRES}'
      - 'POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}'
      - 'POSTGRES_DB=${POSTGRES_DATABASE:-calcom}'
    volumes:
      - 'calcom-postgresql-data:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${SERVICE_USER_POSTGRES} -d ${POSTGRES_DATABASE:-calcom}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: 'redis:7-alpine'
    container_name: calcom-redis
    networks:
      - coolify
    volumes:
      - 'calcom-redis-data:/data'
    command: 'redis-server --appendonly yes'
    restart: unless-stopped

volumes:
  calcom-postgresql-data: null
  calcom-redis-data: null

networks:
  coolify:
    external: true
