version: '3.8'

services:
  calcom:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - 'NEXT_PUBLIC_WEBAPP_URL=https://booking.innov8protech.com'
        - NEXT_PUBLIC_LICENSE_CONSENT=agree
        - CALCOM_TELEMETRY_DISABLED=1
        - 'NEXTAUTH_SECRET=${NEXTAUTH_SECRET}'
        - 'CALENDSO_ENCRYPTION_KEY=${CALENDSO_ENCRYPTION_KEY}'
        - 'DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DATABASE:-calcom}'
    container_name: calcom
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - 'DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DATABASE:-calcom}'
      - 'DATABASE_DIRECT_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DATABASE:-calcom}'
      - 'NEXTAUTH_URL=https://booking.innov8protech.com/api/auth'
      - 'NEXTAUTH_SECRET=${SERVICE_BASE64_32_SECRET}'
      - 'CALENDSO_ENCRYPTION_KEY=${SERVICE_BASE64_32_SECRET}'
      - 'NEXT_PUBLIC_WEBAPP_URL=https://booking.innov8protech.com'
      - 'NEXT_PUBLIC_API_V2_URL=${SERVICE_API_V2_URL}'
      - CALCOM_TELEMETRY_DISABLED=1
      - 'REDIS_URL=redis://redis:6379'
      - 'EMAIL_SERVER_HOST=${SMTP_HOST}'
      - 'EMAIL_SERVER_PORT=${SMTP_PORT}'
      - 'EMAIL_SERVER_USER=${SMTP_USER}'
      - 'EMAIL_SERVER_PASSWORD=${SMTP_PASSWORD}'
      - 'EMAIL_FROM=${MAIL_FROM}'
    restart: unless-stopped

  postgres:
    image: 'postgres:16-alpine'
    container_name: calcom-postgres
    environment:
      - 'POSTGRES_USER=${SERVICE_USER_POSTGRES}'
      - 'POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}'
      - 'POSTGRES_DB=${POSTGRES_DATABASE:-calcom}'
    volumes:
      - 'calcom-postgresql-data:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U ${SERVICE_USER_POSTGRES} -d ${POSTGRES_DATABASE:-calcom}'
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: 'redis:7-alpine'
    container_name: calcom-redis
    volumes:
      - 'calcom-redis-data:/data'
    command: 'redis-server --appendonly yes'
    restart: unless-stopped

volumes:
  calcom-postgresql-data: null
  calcom-redis-data: null    restart: unless-stopped

volumes:
  calcom-postgresql-data: null
  calcom-redis-data: null
