version: '3.8'

services:
  calcom:
    image: 'calcom/cal.com:latest'
    container_name: calcom
    extra_hosts:
      - "console.cal.com:0.0.0.0"
      - "app.cal.com:0.0.0.0"
      - "license.cal.com:0.0.0.0"
      - "api.cal.com:0.0.0.0"
    command: sh -c "npx prisma migrate deploy --schema /calcom/packages/prisma/schema.prisma && /calcom/scripts/start.sh"
    labels:
      traefik.enable: "true"
      traefik.docker.network: "coolify"
      traefik.http.routers.calcom-http.entryPoints: "http"
      traefik.http.routers.calcom-http.rule: "Host(`schedule.innov8protech.com`)"
      traefik.http.routers.calcom-http.middlewares: "calcom-redirect"
      traefik.http.middlewares.calcom-redirect.redirectscheme.scheme: "https"
      traefik.http.routers.calcom-https.entryPoints: "https"
      traefik.http.routers.calcom-https.rule: "Host(`schedule.innov8protech.com`)"
      traefik.http.routers.calcom-https.tls: "true"
      traefik.http.routers.calcom-https.tls.certresolver: "letsencrypt"
      traefik.http.services.calcom.loadbalancer.server.port: "3000"
    networks:
      - coolify
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - 'DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DATABASE:-calcom}'
      - 'DATABASE_DIRECT_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DATABASE:-calcom}'
      - 'NEXTAUTH_URL=https://schedule.innov8protech.com/api/auth'
      - 'NEXTAUTH_URL_INTERNAL=http://127.0.0.1:3000/api/auth'
      - 'NODE_TLS_REJECT_UNAUTHORIZED=0'
      - 'NEXTAUTH_SECRET=${SERVICE_BASE64_32_SECRET}'
      - 'CALENDSO_ENCRYPTION_KEY=${SERVICE_BASE64_32_SECRET}'
      - 'NEXT_PUBLIC_WEBAPP_URL=https://schedule.innov8protech.com'
      - 'BUILT_NEXT_PUBLIC_WEBAPP_URL=http://localhost:3000'
      - 'NEXT_PUBLIC_API_V2_URL=${SERVICE_API_V2_URL}'
      - 'NEXT_PUBLIC_IS_E2E=0'
      - 'ALLOWED_HOSTNAMES="schedule.innov8protech.com"'
      - 'AUTH_TRUST_HOST=true'
      - 'CALCOM_TELEMETRY_DISABLED=1'
      - 'CAL_SIGNATURE_TOKEN=self-hosted'
      - 'CALCOM_LICENSE_KEY='
      - 'REDIS_URL=redis://redis:6379'
      - 'EMAIL_SERVER_HOST=${SMTP_HOST}'
      - 'EMAIL_SERVER_PORT=${SMTP_PORT}'
      - 'EMAIL_SERVER_USER=${SMTP_USER}'
      - 'EMAIL_SERVER_PASSWORD=${SMTP_PASSWORD}'
      - 'EMAIL_FROM=${MAIL_FROM}'
    restart: unless-stopped

  postgres:
    image: 'postgres:16-alpine'
    container_name: calcom-postgres
    networks:
      - coolify
    environment:
      - 'POSTGRES_USER=${SERVICE_USER_POSTGRES}'
      - 'POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}'
      - 'POSTGRES_DB=${POSTGRES_DATABASE:-calcom}'
    volumes:
      - 'calcom-postgresql-data:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${SERVICE_USER_POSTGRES} -d ${POSTGRES_DATABASE:-calcom}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: 'redis:7-alpine'
    container_name: calcom-redis
    networks:
      - coolify
    volumes:
      - 'calcom-redis-data:/data'
    command: 'redis-server --appendonly yes'
    restart: unless-stopped

volumes:
  calcom-postgresql-data: null
  calcom-redis-data: null

networks:
  coolify:
    external: true
